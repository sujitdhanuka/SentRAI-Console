# Copy this into your app repo as .github/workflows/sentrai-gate.yml
#
# It runs the SentRAI pre-deployment compliance gate on every PR and push to
# main, blocks the build on a `fail` verdict, and uploads SARIF so violations
# render in the GitHub Security tab. No script to vendor — it references the
# packaged action directly.
name: SentRAI AI Compliance Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write # upload SARIF

jobs:
  sentrai-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SentRAI Pre-Deployment Gate
        id: gate
        # Pin to a released tag (recommended). Use @main to track latest.
        uses: sujitdhanuka/SentRAI-Console/ci-integration/sentrai-gate-action@v1
        with:
          sentrai-url: ${{ vars.SENTRAI_URL }} # e.g. https://sentraiconsole.com
          ci-token: ${{ secrets.SENTRAI_CI_TOKEN }} # app → CI Gate Ledger → “Set up CI scanning”

      - name: Upload SARIF to the Security tab
        if: always() && steps.gate.outputs.sarif-file != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.gate.outputs.sarif-file }}
